<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">📦 Add Product</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input
                            type="text"
                            name="product_name"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Purchase Price</label>
                        <input
                            type="number"
                            step="0.01"
                            name="purchase_price"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Selling Price</label>
                        <input
                            type="number"
                            step="0.01"
                            name="selling_price"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Opening Stock</label>
                        <input
                            type="number"
                            name="stock"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">
                        💾 Save Product
                    </button>

                    <a
                        href="/"
                        class="btn btn-secondary">
                        Dashboard
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
