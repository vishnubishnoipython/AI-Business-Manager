<!DOCTYPE html>
<html>
<head>
    <title>Customer Ledger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>📋 Customer Ledger</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Balance</th>
            <th>Remarks</th>
            <th>Date</th>
        </tr>

        {% for row in ledger %}

        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>₹{{ row[3] }}</td>
            <td>₹{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[6] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/ai-chat">⬅ Back to AI Chat</a>

</body>
</html>
