<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>✏️ Edit Product</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Product Name</label>
                    <input
                        type="text"
                        name="product_name"
                        class="form-control"
                        value="{{ product[1] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Category</label>
                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ product[2] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Purchase Price</label>
                    <input
                        type="number"
                        step="0.01"
                        name="purchase_price"
                        class="form-control"
                        value="{{ product[3] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Selling Price</label>
                    <input
                        type="number"
                        step="0.01"
                        name="selling_price"
                        class="form-control"
                        value="{{ product[4] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Stock</label>
                    <input
                        type="number"
                        name="stock"
                        class="form-control"
                        value="{{ product[5] }}"
                        required>
                </div>

                <button class="btn btn-success">
                    Update Product
                </button>

                <a href="/view-products"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
