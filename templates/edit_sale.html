<!DOCTYPE html>
<html>

<head>
    <title>Edit Sale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">✏️ Edit Sale</h2>

<form method="POST">

<div class="mb-3">
<label>Customer Name</label>
<input type="text" name="customer" class="form-control" value="{{ sale[1] }}" required>
</div>

<div class="mb-3">
<label>Product Name</label>
<input type="text" name="product" class="form-control" value="{{ sale[2] }}" required>
</div>

<div class="mb-3">
<label>Quantity</label>
<input type="number" name="quantity" class="form-control" value="{{ sale[3] }}" required>
</div>

<div class="mb-3">
<label>Price</label>
<input type="number" name="price" class="form-control" value="{{ sale[4] }}" required>
</div>

<button class="btn btn-warning">
Update Sale
</button>

<a href="/view-sales" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</body>
</html>
