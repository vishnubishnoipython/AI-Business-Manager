<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                🚀 AI Business Manager
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="row">

            <!-- Sales -->
            <div class="col-md-4 mb-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Today's Sales</h5>
                        <h2 class="text-success">₹{{ total_sales }}</h2>
                    </div>
                </div>
            </div>

            <!-- Expense -->
            <div class="col-md-4 mb-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Today's Expense</h5>
                        <h2 class="text-danger">₹0</h2>
                    </div>
                </div>
            </div>

            <!-- Profit -->
            <div class="col-md-4 mb-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Today's Profit</h5>
                        <h2 class="text-primary">₹0</h2>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center mt-4">

            <a href="/add-sale" class="btn btn-success btn-lg me-3">
                ➕ Add Sale
            </a>

            <button class="btn btn-danger btn-lg me-3">
                ➖ Add Expense
            </button>

            <a href="/view-sales" class="btn btn-primary btn-lg">
                📋 View Sales
            </a>

        </div>

    </div>

</body>

</html>
