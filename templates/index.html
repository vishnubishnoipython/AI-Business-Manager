<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Business Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark shadow">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            🚀 AI Business Manager
        </span>

    </div>

</nav>



<div class="container mt-5">


    <h2 class="text-center mb-4">
        📊 Business Overview
    </h2>



    <!-- Dashboard Cards -->

    <div class="row">



        <!-- Sales Card -->

        <div class="col-md-4 mb-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        💰 Total Sales
                    </h5>

                    <h2 class="text-success">
                        ₹{{ total_sales }}
                    </h2>

                </div>

            </div>

        </div>





        <!-- Expense Card -->

        <div class="col-md-4 mb-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        💸 Total Expense
                    </h5>


                    <h2 class="text-danger">
                        ₹{{ total_expenses }}
                    </h2>


                </div>

            </div>

        </div>





        <!-- Profit Card -->

        <div class="col-md-4 mb-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        📈 Net Profit
                    </h5>


                    <h2 class="text-primary">
                        ₹{{ profit }}
                    </h2>


                </div>

            </div>

        </div>


    </div>





    <!-- Quick Actions -->

    <h3 class="text-center mt-4 mb-3">
        ⚡ Quick Actions
    </h3>



    <div class="text-center">


        <a href="/add-sale" class="btn btn-success btn-lg m-2">
            ➕ Add Sale
        </a>


        <a href="/view-sales" class="btn btn-primary btn-lg m-2">
            📋 View Sales
        </a>


        <a href="/add-expense" class="btn btn-danger btn-lg m-2">
            ➖ Add Expense
        </a>


        <a href="/view-expenses" class="btn btn-warning btn-lg m-2">
            💰 View Expenses
        </a>


    </div>




</div>


</body>

</html>
